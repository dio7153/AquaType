[pytest]
testpaths = tests
addopts = -q --no-header -p no:cacheprovider --strict-markers -m "not overfit"
markers =
    slow: needs T7 data or long runtime (deselect with -m "not slow")
    native: needs the compiled decoder_native extension
    mlx: needs Apple Silicon MLX
    timing: asserts a latency budget; auto-skipped when the machine is loaded (loadavg > 0.3 x cores)
    overfit: the P4.14 50-sentence overfit run (tens of minutes on CPU); deselected by default, run with -m overfit
filterwarnings =
    ignore::DeprecationWarning
